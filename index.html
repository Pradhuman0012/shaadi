<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>सोमेश & पूजा · शादी</title>
<meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121010" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="सोमेश शादी">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Mukta:wght@400;500;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EC;--surface:#FFFFFF;--surface2:#FBF8F3;--ink:#1F1A17;--ink2:#4A423C;--muted:#8C8279;--line:#ECE5DA;
  --accent:#6E1423;--accent-ink:#FFFFFF;--accent-soft:#F4E9E6;--gold:#B08D57;--gold-soft:#F3EBDD;
  --ok:#4C6B52;--ok-soft:#E8EFE8;--urgent:#A23B2A;--urgent-soft:#F6E6E1;--soon:#9A6F2A;--soon-soft:#F5EDDC;
  --hero1:#5A0F1C;--hero2:#3A0812;--on-hero:#F6EEE3;
  --shadow:0 1px 2px rgba(31,26,23,.04),0 6px 20px -12px rgba(31,26,23,.18);
  --radius:16px;--navh:64px;
  --serif:"Tiro Devanagari Hindi","Noto Serif Devanagari",serif;
  --latin:"Cormorant Garamond","Times New Roman",serif;
  box-sizing:border-box;color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#121010;--surface:#1B1817;--surface2:#211D1B;--ink:#F3EDE4;--ink2:#D3CABF;--muted:#9C9187;--line:#2E2926;
  --accent:#D99AA5;--accent-ink:#2A0A10;--accent-soft:#33201F;--gold:#CDAE7A;--gold-soft:#2C2519;
  --ok:#8FB596;--ok-soft:#1F2A21;--urgent:#E5937F;--urgent-soft:#35201B;--soon:#D9B06A;--soon-soft:#2F2617;
  --hero1:#3D0A14;--hero2:#22050B;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#121010;--surface:#1B1817;--surface2:#211D1B;--ink:#F3EDE4;--ink2:#D3CABF;--muted:#9C9187;--line:#2E2926;
  --accent:#D99AA5;--accent-ink:#2A0A10;--accent-soft:#33201F;--gold:#CDAE7A;--gold-soft:#2C2519;
  --ok:#8FB596;--ok-soft:#1F2A21;--urgent:#E5937F;--urgent-soft:#35201B;--soon:#D9B06A;--soon-soft:#2F2617;
  --hero1:#3D0A14;--hero2:#22050B;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -14px rgba(0,0,0,.7);}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- app shell ---------- */
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 24px)}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 20px 10px;display:flex;align-items:center;gap:12px}
.topbar h1{margin:0;font-family:var(--serif);font-weight:400;font-size:1.35rem;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .back{border:none;background:none;padding:6px 8px 6px 0;color:var(--accent);font-weight:500;display:flex;align-items:center;gap:2px}
.sdot{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:.75rem;color:var(--muted)}
.sdot::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sdot.on::before{background:var(--ok)}.sdot.off::before{background:var(--soon)}

.seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:19;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  display:flex;gap:6px;overflow-x:auto;padding:4px 20px 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:999px;padding:6px 14px;font-size:.92rem;display:flex;align-items:center;gap:6px}
.seg button small{font-size:.75rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"] small{color:color-mix(in srgb,var(--bg) 70%,transparent)}

.view{padding:4px 16px 0;overflow-x:hidden}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh)}
.nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:.72rem;letter-spacing:.01em}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
.nav button[aria-current="page"] svg{stroke-width:2}

/* ---------- cards & lists ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 14px;overflow:hidden}
.card-h{display:flex;align-items:baseline;gap:10px;padding:16px 18px 6px}
.card-h h2{margin:0;font-family:var(--serif);font-weight:400;font-size:1.15rem;flex:1}
.card-h .lnk{border:none;background:none;color:var(--accent);font-size:.88rem;font-weight:500;padding:0}
.card-sub{margin:0;padding:0 18px 8px;color:var(--muted);font-size:.86rem}
.eyebrow{font-size:.78rem;color:var(--gold);font-weight:600}

.grp-h{display:flex;align-items:center;gap:10px;margin:18px 6px 8px}
.grp-h h3{margin:0;font-size:.85rem;font-weight:600;color:var(--muted);flex:1}
.grp-h .cnt{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grp-h .cnt.full{color:var(--ok)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card .list{border:none;box-shadow:none;border-radius:0}
.row{display:flex;align-items:center;gap:4px;padding-left:14px;min-height:56px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:52px;right:0;border-top:1px solid var(--line)}
.ck{flex:none;width:30px;height:30px;border:none;background:none;padding:0;display:grid;place-items:center}
.ck i{width:22px;height:22px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--muted) 70%,transparent);display:grid;place-items:center;transition:all .15s}
.ck[aria-checked="true"] i{background:var(--ok);border-color:var(--ok)}
.ck[aria-checked="true"] i::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.rb{flex:1;min-width:0;border:none;background:none;text-align:left;padding:11px 14px 11px 8px;display:flex;align-items:center;gap:10px}
.rb .tx{flex:1;min-width:0}
.rt{display:block;font-size:.98rem;color:var(--ink);line-height:1.4}
.rs{display:block;font-size:.8rem;color:var(--muted);line-height:1.35;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.rm:empty{display:none}
.pill{font-size:.72rem;font-weight:600;border-radius:999px;padding:1px 8px;line-height:1.5}
.pill.urgent{background:var(--urgent-soft);color:var(--urgent)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pill.who{background:var(--accent-soft);color:var(--accent)}
.pill.note{background:var(--gold-soft);color:var(--soon)}
.chev{flex:none;width:7px;height:7px;border-right:1.5px solid var(--muted);border-top:1.5px solid var(--muted);transform:rotate(45deg);opacity:.7;margin-right:4px}
.row.done .rt{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 60%,transparent)}
.empty{text-align:center;color:var(--muted);padding:36px 20px;font-size:.92rem}

.tools{display:flex;gap:8px;align-items:center;margin:2px 2px 4px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px}
.search svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:16px;height:100%}
.toggle{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;height:40px;padding:0 12px;font-size:.85rem;color:var(--ink2)}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.sechead{display:flex;align-items:center;gap:12px;margin:6px 4px 2px}
.sechead p{margin:0;flex:1;color:var(--muted);font-size:.86rem}
.ring{--p:0;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--line) 0)}
.ring span{width:36px;height:36px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.72rem;font-weight:600;color:var(--ink2)}

.fab{position:fixed;right:max(18px,calc(50% - 280px + 18px));bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 16px);z-index:25;
  width:54px;height:54px;border-radius:18px;border:none;background:var(--accent);color:var(--accent-ink);box-shadow:0 10px 24px -8px color-mix(in srgb,var(--accent) 70%,transparent);display:grid;place-items:center}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}

/* ---------- home ---------- */
.hero{position:relative;border-radius:22px;overflow:hidden;color:var(--on-hero);padding:26px 22px 22px;margin:0 0 14px;text-align:center;
  background:radial-gradient(90% 70% at 50% 0%,rgba(205,174,122,.22),transparent 65%),linear-gradient(170deg,var(--hero1),var(--hero2));box-shadow:0 18px 40px -22px rgba(58,8,18,.8)}
.hero::after{content:"";position:absolute;inset:8px;border:1px solid rgba(205,174,122,.35);border-radius:16px;pointer-events:none}
.mono{width:58px;height:58px;margin:0 auto 12px;border-radius:50%;border:1px solid rgba(205,174,122,.7);display:flex;align-items:center;justify-content:center;font-family:var(--latin);font-size:1.45rem;color:#E8D3AA;letter-spacing:.04em}
.mono em{font-style:italic;font-size:.75em;margin:0 1px;color:rgba(232,211,170,.75)}
.hero .shri{margin:0;font-family:var(--serif);font-size:.85rem;color:rgba(232,211,170,.85)}
.hero .names{margin:8px 0 2px;font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,8.5vw,2.4rem);line-height:1.2}
.hero .names i{font-family:var(--latin);font-style:italic;color:#E8D3AA;font-size:.85em;margin:0 .2em}
.hero .date{margin:0;font-size:.86rem;color:rgba(246,238,227,.75)}
.hero .date b{font-weight:400;color:rgba(232,211,170,.6);margin:0 .5em}
.count{display:grid;grid-template-columns:1fr 1px 1fr 1px 1fr;align-items:center;margin:20px 0 4px}
.count .sep{height:34px;background:rgba(205,174,122,.3)}
.count div b{display:block;font-family:var(--latin);font-weight:500;font-size:2rem;line-height:1;color:#F3E2BE}
.count div span{display:block;font-size:.76rem;color:rgba(246,238,227,.7);margin-top:6px}
.hbar{height:3px;border-radius:2px;background:rgba(246,238,227,.15);margin:18px 6px 0;overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,#B08D57,#E8D3AA);width:0;transition:width .4s}
.secrow{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:12px 18px;position:relative}
.secrow+.secrow::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:1px solid var(--line)}
.secrow .tx{flex:1;min-width:0}
.secrow .tx b{display:block;font-weight:500}
.secrow .tx span{font-size:.8rem;color:var(--muted)}
.mini{width:64px;height:4px;border-radius:2px;background:var(--line);overflow:hidden;flex:none}
.mini i{display:block;height:100%;background:var(--ok)}
.tl{list-style:none;margin:0;padding:6px 18px 14px}
.tl li{display:grid;grid-template-columns:14px 1fr;gap:12px;position:relative;padding:8px 0}
.tl li::before{content:"";width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold);margin-top:7px;background:var(--surface);z-index:1}
.tl li::after{content:"";position:absolute;left:5px;top:22px;bottom:-8px;width:1px;background:var(--line)}
.tl li:last-child::after{display:none}
.tl b{display:block;font-weight:500}
.tl span{font-size:.82rem;color:var(--muted)}
.note-line{margin:0;padding:10px 18px 14px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}

/* program & menu */
.ev{width:100%;border:none;background:none;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 18px;position:relative}
.ev+.ev::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:1px solid var(--line)}
.ev .w{grid-column:1;font-size:.82rem;color:var(--gold);font-weight:600}
.ev b{grid-column:1;font-family:var(--serif);font-weight:400;font-size:1.08rem}
.ev p{grid-column:1;margin:2px 0 0;font-size:.88rem;color:var(--ink2)}
.ev .chev{grid-column:2;grid-row:1 / span 3;align-self:center}

/* team */
.person{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:12px 16px;position:relative}
.person+.person::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.av.none{background:var(--surface2);color:var(--muted);border:1px dashed var(--line)}
.person .tx{flex:1;min-width:0}.person .tx b{display:block;font-weight:500}.person .tx span{font-size:.8rem;color:var(--muted)}
.opt{display:flex;align-items:center;gap:12px;width:100%;border:none;background:none;text-align:left;padding:14px 18px;position:relative;color:var(--ink)}
.opt+.opt::before{content:"";position:absolute;top:0;left:18px;right:0;border-top:1px solid var(--line)}
.opt>span:first-child{flex:1}.opt.danger{color:var(--urgent)}.opt.armed{background:var(--urgent);color:#fff}
.opt small{color:var(--muted)}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(20,12,10,.42);animation:fade .2s ease}
.panel{position:relative;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;
  padding:8px 20px calc(env(safe-area-inset-bottom,0px) + 22px);animation:up .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.sh-top{display:flex;align-items:flex-start;gap:10px}
.sh-top .tx{flex:1;min-width:0}
.sh-top h2{margin:2px 0 0;font-family:var(--serif);font-weight:400;font-size:1.35rem;line-height:1.3}
.sh-top p{margin:4px 0 0;color:var(--muted);font-size:.88rem}
.x{flex:none;width:32px;height:32px;border-radius:50%;border:none;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.state{width:100%;margin:18px 0 6px;border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-align:left}
.state i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;flex:none}
.state.on{background:var(--ok-soft);border-color:transparent}
.state.on i{background:var(--ok);border-color:var(--ok)}
.state.on i::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.state b{font-weight:500}
.fld{display:block;margin:14px 0 0}
.fld>span{display:block;font-size:.82rem;color:var(--muted);font-weight:600;margin:0 0 6px 2px}
.fld input,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:11px 13px;font-size:16px;line-height:1.5;outline:none}
.fld input:focus,.fld textarea:focus{border-color:var(--gold);background:var(--surface)}
.fld textarea{resize:none;min-height:88px;overflow:hidden}
.calls{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.calls:empty{display:none}
.calls a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ok);background:var(--ok-soft);border-radius:999px;padding:6px 12px;font-size:.88rem;font-weight:500}
.sh-acts{display:flex;gap:10px;margin-top:20px}
.b{flex:1;height:46px;border-radius:13px;border:1px solid var(--line);background:var(--surface);font-weight:500;color:var(--ink2)}
.b.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.b.danger{color:var(--urgent)}
.b.armed{background:var(--urgent);border-color:var(--urgent);color:#fff}
.hint{font-size:.82rem;color:var(--muted);margin:8px 2px 0}

/* ---------- lock ---------- */
.lock{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;
  background:radial-gradient(70% 50% at 50% 0%,color-mix(in srgb,var(--gold) 16%,transparent),transparent 70%),var(--bg)}
.lockbox{width:min(360px,100%);text-align:center}
.lockbox .mono{border-color:var(--gold);color:var(--accent);width:68px;height:68px;font-size:1.7rem}
.lockbox .mono em{color:var(--gold)}
.lockbox .shri{margin:0;font-family:var(--serif);color:var(--gold);font-size:.9rem}
.lockbox h1{margin:10px 0 4px;font-family:var(--serif);font-weight:400;font-size:2.2rem;line-height:1.2}
.lockbox h1 i{font-family:var(--latin);color:var(--gold);margin:0 .2em}
.lockbox .date{margin:0;color:var(--muted);font-size:.88rem}
.rule{width:120px;height:1px;margin:24px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.lockbox label{display:block;text-align:left;font-size:.85rem;color:var(--muted);font-weight:600;margin:0 0 8px 4px}
.lockbox input{width:100%;height:50px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:0 16px;font-size:16px;text-align:center;letter-spacing:.12em;outline:none}
.lockbox input:focus{border-color:var(--gold)}
.lockbox .b{width:100%;margin-top:12px;flex:none}
.lockmsg{min-height:1.4em;margin:12px 0 0;font-size:.88rem;color:var(--urgent)}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;box-shadow:var(--shadow);animation:up .2s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:600px){.view{padding:4px 20px 0}}
</style>

const SHEET_URL="https://script.google.com/macros/s/AKfycbydfMhfuLyy5KRzu7_FFhCkG0WrwzALWOHd6v_rX-dtIcfqavIk8zGQ0nkuLoumtiLDiA/exec"; // <-- यहाँ Apps Script का Web app URL डालें (" " के बीच)
let db=null,ready=false,readOnly=false,syncTimer=null,syncPending=false,pendingRender=false,offline=false,badCode=false,started=false;
let synced={items:{},custom:{}};
let remote={items:null,custom:null};
let chain=Promise.resolve(),inflight=0;
let code=(()=>{try{return localStorage.getItem(KEY+"-code")||"";}catch(e){return "";}})();
function itemIds(){const s=new Set();["checked","who","note","edits","hidden"].forEach(k=>Object.keys(state[k]).forEach(i=>s.add(i)));return s;}
function itemBody(id){return {c:!!state.checked[id],w:state.who[id]||"",n:state.note[id]||"",e:state.edits[id]===undefined?null:state.edits[id],h:!!state.hidden[id]};}
function customMap(){const m={};Object.keys(state.custom).forEach(sec=>(state.custom[sec]||[]).forEach(c=>{m[c.id]=Object.assign({sec},c);}));return m;}
function scheduleSync(){if(!db||!ready)return;syncPending=true;clearTimeout(syncTimer);syncTimer=setTimeout(sync,600);}
function sync(){
  syncPending=false;
  if(!db||!ready)return;
  const ops=[],ids=itemIds();
  ids.forEach(id=>{const b=itemBody(id),j=JSON.stringify(b);if(synced.items[id]!==j){synced.items[id]=j;ops.push({k:"items",id,b});}});
  Object.keys(synced.items).forEach(id=>{if(!ids.has(id)){delete synced.items[id];ops.push({k:"items",id,b:null});}});
  const cm=customMap();
  Object.keys(cm).forEach(id=>{const j=JSON.stringify(cm[id]);if(synced.custom[id]!==j){synced.custom[id]=j;ops.push({k:"custom",id,b:cm[id]});}});
  Object.keys(synced.custom).forEach(id=>{if(!cm[id]){delete synced.custom[id];ops.push({k:"custom",id,b:null});}});
  if(!ops.length)return;
  inflight++;
  chain=chain.then(()=>fetch(SHEET_URL,{method:"POST",body:JSON.stringify({code,ops})}).then(r=>r.json()).then(j=>{
      if(!j.ok){if(j.error==="code"){badCode=true;db=null;}throw new Error(j.error||"fail");}
      offline=false;setStatus();
    })).catch(()=>{
      ops.forEach(o=>{if(o.b===null)synced[o.k][o.id]="retry";else delete synced[o.k][o.id];});
      if(db){offline=true;setStatus();setTimeout(scheduleSync,10000);}else setStatus();
    }).finally(()=>{inflight--;});
}
function dirtyItems(){const d=new Set();itemIds().forEach(id=>{if(synced.items[id]!==JSON.stringify(itemBody(id)))d.add(id);});return d;}
function applyRemote(){
  if(!remote.items||!remote.custom)return;
  let first=false;
  if(!ready){
    ready=true;first=true;
    if(remote.items.empty&&remote.custom.empty){setStatus();sync();return;} // पहली बार: इस फ़ोन का डेटा Sheet में भेजें
  }
  const keep=first?new Set():dirtyItems(),local={};keep.forEach(id=>local[id]=itemBody(id));
  const ns={checked:{},custom:{},who:{},note:{},edits:{},hidden:{}};
  synced={items:{},custom:{}};
  remote.items.docs.forEach(d=>{const b=d.data();if(!b)return;synced.items[d.id]=JSON.stringify({c:!!b.c,w:b.w||"",n:b.n||"",e:b.e===undefined?null:b.e,h:!!b.h});
    const v=local[d.id]||b;if(v.c)ns.checked[d.id]=true;if(v.w)ns.who[d.id]=v.w;if(v.n)ns.note[d.id]=v.n;if(v.e!==null&&v.e!==undefined)ns.edits[d.id]=v.e;if(v.h)ns.hidden[d.id]=true;});
  remote.custom.docs.forEach(d=>{const b=d.data();if(!b)return;synced.custom[d.id]=JSON.stringify(b);const c=Object.assign({},b);const sec=c.sec;delete c.sec;(ns.custom[sec]=ns.custom[sec]||[]).push(c);});
  Object.keys(ns.custom).forEach(k=>ns.custom[k].sort((a,b)=>String(a.id).localeCompare(String(b.id))));
  const changed=JSON.stringify(ns)!==JSON.stringify(state);
  state=ns;saveLocal();setStatus();
  if(keep.size)scheduleSync();
  if(changed)safeRender();
}
function editing(){if(!$("sheet").hidden)return true;const a=document.activeElement;return a&&$("view").contains(a)&&a.tagName==="INPUT";}
function safeRender(){if(editing()){pendingRender=true;return;}pendingRender=false;render();}
document.addEventListener("focusout",()=>setTimeout(()=>{if(pendingRender&&!editing())safeRender();},50));
function setStatus(){
  const s=$("sync");if(!s)return;
  let t,l,cls="sdot";
  if(!SHEET_URL){t="इसी फ़ोन में";l="लिस्ट सिर्फ़ इसी फ़ोन में सेव हो रही है";}
  else if(badCode){t="कोड";l="फ़ैमिली कोड गलत है";cls+=" off";}
  else if(offline){t="ऑफ़लाइन";l="इंटरनेट नहीं है, बदलाव बाद में सेव होंगे";cls+=" off";}
  else if(ready){t="सिंक";l="सबके साथ जुड़ी हुई लिस्ट";cls+=" on";}
  else {t="…";l="जुड़ रहा है";}
  s.textContent=t;s.className=cls;s.title=l;s.setAttribute("aria-label",l);statusText=l;
  gate();
}
async function load(){
  if(!db||inflight||syncPending)return;
  try{
    const r=await fetch(SHEET_URL+"?code="+encodeURIComponent(code)+"&t="+Date.now());
    const j=await r.json();
    if(!j.ok){if(j.error==="code"){badCode=true;db=null;setStatus();}return;}
    if(inflight||syncPending)return;
    const snap=o=>{const docs=Object.keys(o||{}).map(id=>({id,data:()=>o[id]}));return {docs,empty:!docs.length};};
    remote.items=snap(j.items);remote.custom=snap(j.custom);offline=false;applyRemote();
  }catch(e){offline=true;setStatus();}
}
function connect(){
  if(!SHEET_URL){setStatus();return;}
  if(!code){badCode=true;setStatus();return;}
  db={};badCode=false;setStatus();load();
  if(!started){started=true;
    setInterval(()=>{if(!document.hidden)load();},15000);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)load();});
  }
}

function mkC(sec,c){return {id:c.id,sec,text:textOf(c.id,c.text),sub:"",tag:""};}
function groupsOf(secId){
  const sec=SEC[secId],out=[];
  if(sec.events&&!sec.menu){
    sec.events.forEach((ev,ei)=>{
      const items=ev.items.map((it,ii)=>mk(secId,`${secId}-${ei}-${ii}`,it)).concat((state.custom[`ev-${secId}-${ei}`]||[]).map(c=>mkC(secId,c)));
      out.push({title:ev.what,items});
    });
  }
  const G=GROUPS[secId];
  if(G){
    const used=new Set();
    G.forEach(([t,idx])=>out.push({title:t,items:idx.filter(i=>sec.items[i]).map(i=>{used.add(i);return mk(secId,`${secId}-${i}`,sec.items[i]);})}));
    const rest=(sec.items||[]).map((it,i)=>[it,i]).filter(x=>!used.has(x[1])).map(([it,i])=>mk(secId,`${secId}-${i}`,it));
    const cust=(state.custom[secId]||[]).map(c=>mkC(secId,c));

    const inp=field("डेटा पेस्ट करें","textarea","","यहाँ पेस्ट करें");
    const im=btn("b primary","Import");im.style.cssText="width:100%;margin-top:12px";
    im.onclick=()=>{let d;try{d=JSON.parse(inp.input.value.trim());}catch(e){d=null;}
      if(!d||typeof d!=="object"||!d.checked){toast("यह डेटा सही नहीं है");return;}
      ["checked","who","note","edits","hidden"].forEach(k=>{if(d[k]&&typeof d[k]==="object")Object.assign(state[k],d[k]);});
      if(d.custom&&typeof d.custom==="object")Object.keys(d.custom).forEach(sec=>{const have=new Set((state.custom[sec]||[]).map(c=>c.id));(d.custom[sec]||[]).forEach(c=>{if(c&&c.id&&!have.has(c.id))(state.custom[sec]=state.custom[sec]||[]).push(c);});});
      save();closeSheet();toast("डेटा आ गया");};
    b.append(cp,out.wrap,inp.wrap,im);
  });
}

/* ---------- render ---------- */
function renderView(){
  const v=$("view");v.innerHTML="";
  if(view.tab==="home")homeView(v);
  else if(view.tab==="team")teamView(v);
  else sectionView(view.sub[view.tab],v);
}
function render(){
  const u=[...new Set(Object.values(state.who).map(x=>(x||"").trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,"hi"));
  const dl=$("names");dl.innerHTML="";u.forEach(n=>{const o=el("option");o.value=n;dl.append(o);});
  const nav=$("nav");nav.innerHTML="";
  TABS.forEach(t=>{const b=btn("");b.append(svg(ICON[t.icon]),el("span",null,t.label));if(view.tab===t.id)b.setAttribute("aria-current","page");b.onclick=()=>go(t.id);nav.append(b);});
  const T=TABS.find(t=>t.id===view.tab)||TABS[0];
  const person=view.tab==="team"&&view.person!==null;
  $("title").textContent=view.tab==="home"?"सोमेश & पूजा":person?(view.person||"बिना ज़िम्मेदार"):T.label;
  $("back").hidden=!person;
  const seg=$("seg");seg.innerHTML="";seg.hidden=!T.subs;
  if(T.subs)T.subs.forEach(sid=>{const b=btn("");b.append(document.createTextNode(SHORT[sid]));
    if(!SEC[sid].menu){const s=stats(itemsOf(sid));b.append(el("small",null,String(s.t-s.d)));}
    b.setAttribute("aria-pressed",view.sub[view.tab]===sid);b.onclick=()=>{view.sub[view.tab]=sid;query="";saveUI();render();window.scrollTo(0,0);};seg.append(b);});
  $("fab").hidden=!T.subs;
  renderView();
  const a=seg.querySelector('[aria-pressed="true"]');if(a)a.scrollIntoView({block:"nearest",inline:"center"});
}
$("back").onclick=()=>{view.person=null;render();};
$("fab").onclick=()=>{const sid=view.sub[view.tab],sec=SEC[sid];
  if(sec.menu)openMeal({id:"m"+Date.now(),what:"",when:"",dishes:""},sid,true);else openAdd(sid);};
$("sync").onclick=()=>toast(statusText||"…");

/* ---------- lock gate ---------- */
function okFlag(v){try{if(v===undefined)return localStorage.getItem(KEY+"-ok")==="1";if(v)localStorage.setItem(KEY+"-ok","1");else localStorage.removeItem(KEY+"-ok");}catch(e){return false;}}
let checking=false;
function gate(){
  const lock=$("lock"),app=$("app"),msg=$("lockMsg"),b=$("lockBtn");
  const open=()=>{if(app.hidden){lock.hidden=true;app.hidden=false;render();}};
  const shut=t=>{app.hidden=true;lock.hidden=false;msg.textContent=t||"";};
  if(!SHEET_URL){open();return;}
  if(badCode){okFlag(false);checking=false;b.disabled=false;b.textContent="खोलें";shut(code?"यह कोड सही नहीं है। दोबारा देखकर डालें।":"");return;}
  if(ready){okFlag(true);checking=false;open();return;}
  if(okFlag()){open();return;}
  if(offline){checking=false;b.disabled=false;b.textContent="खोलें";shut("इंटरनेट नहीं मिल रहा। नेटवर्क देखकर दोबारा कोशिश करें।");return;}
  shut(checking?"कोड जाँचा जा रहा है…":"");
}
$("lockBtn").onclick=()=>{
  const v=$("lockIn").value.trim();if(!v){$("lockIn").focus();return;}
  code=v;try{localStorage.setItem(KEY+"-code",v);}catch(e){}
  checking=true;$("lockBtn").disabled=true;$("lockBtn").textContent="जाँच रहे हैं…";
  badCode=false;offline=false;ready=false;synced={items:{},custom:{}};remote={items:null,custom:null};connect();gate();
};
$("lockIn").onkeydown=e=>{if(e.key==="Enter")$("lockBtn").click();};
render();
connect();
gate();
if(!$("lock").hidden)setTimeout(()=>$("lockIn").focus(),50);
</script>
</body>
